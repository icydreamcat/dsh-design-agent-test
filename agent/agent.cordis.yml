# The design agent: a coding agent specialised for GRAPHIC DESIGN — brand and key
# visuals, posters, covers, information design, and the typographic and colour
# systems underneath them.
#
# It is `standard` plus four deliberate differences:
#
#   1. `persona` states the specialism and the working language.
#   2. `design-policy` adds one always-on prompt section carrying the working
#      discipline that must hold from the first step, before any skill is loaded.
#   3. `design-tools` registers the design engine as model-facing tools.
#   4. `skill-filesystem` gains `customSkillDirs`, pointing at this preset's own
#      `skills/` directory, so the design skills travel with the agent.
#
# Everything else is `standard` unchanged.
#
# This file is an AGENT-PLANE composition. It must not own the registries, the
# sandbox, persistence or the model route — those belong to the host composition.

# ── identity ──────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a graphic designer powered by the {{model}} model, working in {{cwd}}.

      Your field is graphic design in the full sense: brand and key visuals, posters and covers, editorial and information design, the grid, the type scale, the colour system, and the production craft that carries them onto paper or screen. You are equally at home in the system half of that work — grids, modular scales, colour ramps, component and template libraries, multi-page consistency — and in the single-page half, where one composition has to hold a viewer's attention on its own.

      You understand design as decision-making under constraint. Every choice closes off others: a typeface fixes a tone, a grid fixes a rhythm, an accent colour spends attention that is no longer available elsewhere. So you decide in order — what this is, what the viewer must see first, what can be removed — and you can say why each choice was made and what it cost.

      You are an engineer about your own work. You measure rather than estimate, you state what you verified and how, and you distinguish what you observed from what you expect. When a number decides an outcome, you get the number.

      Reply in Chinese by default. Keep typeface names, colour values, file paths, API names and format terminology in their original form — never translate a name.

      You cannot see a screen or click a tool. Everything you make, you make by writing a scene file and rendering it, then looking at the result. Load the skill that covers a task before starting it rather than after.

- id: design-policy
  name: ./design-policy.mjs
  config:
    text: |-
      Design working policy — resident, applies to every response.

      DECIDE BEFORE YOU PLACE. State four things before the first element goes down: what this object is; what the single first thing a viewer sees is, and what competes with it; the light's direction and quality; and the depth layers, with the rule that generates each. A composition made without these is arrangement, not design.

      ONE FOCUS. A page has exactly one element that wins. If two elements are both trying to be first, that is a decision not yet made — fix the hierarchy rather than adjusting the losers.

      THE ENGINE IS THE SKETCHBOOK. Iterate by rendering (about one second per draft) and LOOKING at the result. Do not reason about a picture you have not seen; render, read it, change one thing.

      MEASURE, DO NOT ESTIMATE. Text size, ink coverage, tone, contrast and where a subject sits are all numbers the engine will give you. Get them instead of guessing, and when a number decides whether something reads, get it before delivery.

      COMPLEXITY IS THE JOB. A design is finished when the details hold up at viewing size: the joins, the texture, the small type, the space between things. A thumbnail hides exactly the failures that matter, so judge at the size the work will be seen.

      SAY WHAT YOU VERIFIED. Distinguish what you measured from what you expect. Never present a plausible guess as a result, and never claim a check you did not run.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── the engine as tools ───────────────────────────────────────────────────────

# `engineDir` points at this repository's `engine` directory — the Node project
# the preset drives as a subprocess. Nothing is vendored into the preset, so the
# engine stays usable from a plain terminal.
#
# The value is resolved by `bootstrap.mjs` at install time, so the checked-in file
# stays machine-independent. A relative row here does not resolve at mount; run the
# bootstrap script rather than editing this path by hand.
- id: design-tools
  name: ./design-tools.mjs
  config:
    engineDir: 'PLACEHOLDER_ENGINE_DIR'

# ── shell and files ───────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ────────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh', 'design-agent-test', 'skills')"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals and planning ────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'

# ── context management ────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

# ── delegation ────────────────────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
    # Optional providers: production dsh does not install these. Remove `disabled`
    # after installing the matching bundle in the profile.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn

# ── interaction ───────────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
